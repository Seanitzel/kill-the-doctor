name: Native build verification
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'public/**', 'tests/**', 'playwright.config.js', 'vite.config.js', 'package*.json', 'capacitor.config.json', 'scripts/*native*', 'android/**', 'ios/**', '.github/workflows/native.yml']
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'tests/**', 'playwright.config.js', 'vite.config.js', 'package*.json', 'capacitor.config.json', 'scripts/*native*', 'android/**', 'ios/**', '.github/workflows/native.yml']
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run native:android
      - run: npm run native:release:android
      - uses: actions/upload-artifact@v4
        with:
          name: KTD-Android
          path: |
            artifacts/native/KTD-Android.apk
            artifacts/native/KTD-Android-unsigned.aab
          retention-days: 14
  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run native:ios
      - uses: actions/upload-artifact@v4
        with:
          name: KTD-iOS-Simulator
          path: artifacts/native/KTD-iOS-Simulator.zip
          retention-days: 14
  browser:
    # WebKit on macOS is closest to the Safari/iOS rendering target.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KTD-browser-checks
          path: |
            artifacts/browser-results.json
            test-results/
          retention-days: 14
